# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# EGGS! runs as a STATIC Astro site. Every page (home, ~470 episodes, guests, topics)
# is prerendered to HTML at build time, so there is no SPA fallback and no client-side
# RSS proxy — the RSS + YouTube data is fetched once during `astro build`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Canonical production origin used for sitemap URLs, canonical tags, and Open Graph.
  # Set this to the real domain in the Netlify UI (Site settings → Environment variables) if different.
  PUBLIC_SITE_URL = "https://eggscast.com"
  # YouTube Data API key for build-time enrichment (thumbnails, topics, featured order).
  # Set the SECRET value in the Netlify UI as YOUTUBE_API_KEY (do NOT commit it).
  # Without it the site still builds (RSS-only).

# --- Keeping content fresh -------------------------------------------------------------
# Because the site is static, new episodes only appear after a rebuild. Neither Anchor /
# Spotify for Podcasters nor YouTube emit a webhook we rely on, so we watch both feeds:
#
#   netlify/functions/check-new-episode.mjs  (scheduled hourly)
#     → polls the Anchor RSS feed and the YouTube uploads Atom feed; when the newest
#       RSS episode changes, the newest YouTube upload changes, or that upload's Atom
#       `updated` timestamp changes (e.g. thumbnail swap), it POSTs the production
#       build hook. Last-seen values are tracked in Netlify Blobs.
#
# The build hook URL is stored as the secret env var BUILD_HOOK_URL (production context).

# Static asset caching for hashed build output.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
